name: Update Subscriptions

on:
  schedule:
    # ★ 每小时自动刷新: 免费节点寿命常常只有 1~3 小时, 手动触发时遇到"刚抓到手就全 -1"
    #   很常见; 参考项目也是小时级刷新。公开仓库 Actions 分钟数不计量。
    - cron: '0 * * * *'
  workflow_dispatch:  # 保留手动触发按钮
    inputs:
      concurrency:
        description: '测活并发数 (留空=48). 若日志里 no_liveness 占比异常高、p90 逼近超时, 试 32 或 24'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # ★ job 级并发组: 防止两次手动运行同时 git push 互相冲突/覆盖
    concurrency:
      group: update-subscriptions-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      # ★ 缓存 sing-box 内核 + GeoLite2 mmdb: 旧版每次运行都要重新下载 ~40MB,
      #   在十几分钟的耗时里占掉一大块。按自然周更换 key, 保证 mmdb 至少每周刷新。
      - name: Compute runtime cache week
        id: runtime-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore runtime cache (sing-box + mmdb)
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-${{ runner.os }}-${{ steps.runtime-week.outputs.week }}

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'
          # 并发可调: 空值/非法值由脚本回退默认 48
          PROBE_CONCURRENCY: ${{ inputs.concurrency }}
          # ★ 提速: CI 海外视角下 TCP 预检失败直接淘汰 (省 40%~60% 无效 sing-box 探测)
          PREFILTER_DROP: '1'
          # ★ 全量测活上限: 0 = 不限制 (全部候选都要真实检测)
          #   设成 3000 会截断 RTT 尾部节点, 可能漏掉家宽/中转节点
          MAX_FULL_PROBE: '0'
          # ★ rDNS 兜底默认关闭 (每个未知 IP 最多 2s, 分类阶段明显提速)
          CLASSIFY_RDNS: '0'
          # ★ UDP-only (hy2/tuic) 不进主订阅: 前置代理不转发 UDP, 链式必挂
          #   单独导出到 output/udp-direct.*; 想恢复旧行为改 '1'
          EXPORT_UDP_TO_MAIN: '0'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json \
                   residential.txt residential-clash.yaml residential-singbox.json \
                   udp-direct.txt udp-direct-clash.yaml udp-direct-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (branch=${BRANCH}, after push)"
